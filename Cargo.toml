[workspace]
resolver = "3"
# Layers (docs/adr/0001-crate-layout.md): engine <- game <- content <- apps; import and tools on
# the side. `crates/tools/layering` checks the dependency rules as a test.
members = [
    "crates/engine/*",
    "crates/import/*",
    "crates/game/*",
    "crates/apps/*",
    "crates/tools/*",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
# engine
eng_math = { path = "crates/engine/eng_math" }
eng_gfx = { path = "crates/engine/eng_gfx" }
eng_gbi = { path = "crates/engine/eng_gbi" }
eng_render = { path = "crates/engine/eng_render" }
eng_anim = { path = "crates/engine/eng_anim" }
eng_collision = { path = "crates/engine/eng_collision" }
eng_input = { path = "crates/engine/eng_input" }
eng_app = { path = "crates/engine/eng_app" }
eng_asset = { path = "crates/engine/eng_asset" }
eng_audio = { path = "crates/engine/eng_audio" }
# import
oot_import = { path = "crates/import/oot_import" }
# game and content
oot_game = { path = "crates/game/oot_game" }
oot_actors = { path = "crates/game/oot_actors" }
# apps and tools
oot = { path = "crates/apps/oot" }
oot_extract = { path = "crates/tools/oot_extract" }
overworld = { path = "crates/tools/overworld" }
# external
gilrs = "0.11"
glam = { version = "0.33", features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
quick-xml = "0.42"
regex = "1"
anyhow = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
wgpu = "30"
pollster = "0.4"
bincode = "1.3"
zstd = "0.13"
sha1_smol = "1"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui-wgpu = "0.36"
# The importer decodes the prerendered room backgrounds (docs/adr/0014).
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }
# The audio output device, behind eng_audio's `device` feature (docs/adr/0024-audio-mixer.md).
cpal = "0.18"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
