[workspace]
resolver = "3"
members = ["crates/oot_core", "crates/oot_render", "crates/oot_viewer", "crates/ootx", "crates/oot_extract", "crates/oot_game", "crates/oot_pad", "crates/oot_play"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
oot_core = { path = "crates/oot_core" }
oot_game = { path = "crates/oot_game" }
oot_pad = { path = "crates/oot_pad" }
gilrs = "0.11"
glam = { version = "0.33", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
quick-xml = "0.42"
anyhow = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
