[package]
name = "overworld_editor"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Overworld level editor: draw an outline, regions and paths, paint terrain; the level rebuilds as you edit"

[dependencies]
overworld.workspace = true
# The actors it places: their profiles and schemas (ADR 0066), and the game's pack for how the
# game's scenes place them (a tool may link the content crates, ADR 0002).
oot_game.workspace = true
oot_actors.workspace = true
# The actors' captures drawn as the game draws them (docs/EDITOR-ACTORS.md, ADR 0078).
eng_gfx.workspace = true
# The reference dungeons' collision (`reference.rs`).
eng_collision.workspace = true
eng_render.workspace = true
eframe.workspace = true
image.workspace = true
glam.workspace = true
bytemuck.workspace = true
serde_json.workspace = true
# Open and save dialogs.
rfd = "0.17"

[dev-dependencies]
# The headless renders of the Reference mode (`app/reference_ui.rs`).
pollster.workspace = true
